<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — ModernSocial.app Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-deep:    #090910;
    --bg-card:    #12121c;
    --bg-surface: #1a1a28;
    --gold:       #c8a84b;
    --gold-light: #e5c97a;
    --gold-dim:   rgba(200,168,75,0.14);
    --gold-border:rgba(200,168,75,0.22);
    --text:       #f0ede8;
    --text-muted: #7a7773;
    --border:     rgba(255,255,255,0.07);
    --green:      #4a9960;
    --green-dim:  rgba(74,153,96,0.15);
    --red-dim:    rgba(204,68,68,0.12);
  }
  body { background: var(--bg-deep); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

  nav {
    display: flex; align-items: center; gap: 1rem; padding: 0 2rem; height: 58px;
    background: rgba(9,9,16,0.92); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
  }
  .nav-brand { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--gold-light); letter-spacing: 0.05em; text-decoration: none; }
  .nav-badge { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); background: var(--gold-dim); border: 1px solid var(--gold-border); border-radius: 4px; padding: 0.15rem 0.45rem; }
  .nav-links { display: flex; gap: 0; }
  .nav-links a { padding: 0 1rem; height: 58px; display: flex; align-items: center; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); text-decoration: none; border-bottom: 2px solid transparent; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--gold-light); border-bottom-color: var(--gold); }
  .nav-right { margin-left: auto; }
  .nav-logout { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 0.75rem; padding: 0.3rem 0.75rem; cursor: pointer; transition: color 0.2s; }
  .nav-logout:hover { color: var(--text); }

  main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
  .page-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold-light); }
  .page-sub { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.25rem; }

  .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.9rem 0.6rem 2.2rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; }
  .search-wrap input:focus { border-color: var(--gold-border); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 0.65rem; top: 50%; transform: translateY(-50%); font-size: 0.8rem; pointer-events: none; }

  .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.6rem 1.1rem; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.83rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-ghost { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted); }
  .btn-ghost:hover { border-color: var(--gold-border); color: var(--text); opacity: 1; }
  .btn-gold { background: rgba(200,168,75,0.15); border: 1px solid var(--gold-border); color: var(--gold-light); }
  .btn-gold:hover { background: rgba(200,168,75,0.25); opacity: 1; }
  .btn-danger { background: var(--red-dim); border: 1px solid rgba(204,68,68,0.3); color: #f87171; }

  .field-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
  .field-group label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
  .field-group input { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; width: 100%; }
  .field-group input:focus { border-color: var(--gold-border); }
  .field-error { font-size: 0.78rem; color: #f87171; margin-top: 0.25rem; display: none; }
  .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.75rem; }

  .table-wrap { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 0.85rem 1rem; text-align: left; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  td { padding: 0.85rem 1rem; font-size: 0.84rem; vertical-align: middle; }
  td.name-cell { font-weight: 600; }
  td.muted { color: var(--text-muted); }

  .badge { display: inline-flex; align-items: center; padding: 0.22rem 0.65rem; border-radius: 20px; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
  .badge-google { background: rgba(66,133,244,0.15); color: #7aabf0; border: 1px solid rgba(66,133,244,0.25); }
  .badge-email  { background: var(--green-dim); color: #6fcf8a; border: 1px solid rgba(74,153,96,0.25); }
  .badge-type   { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }

  .actions-cell { display: flex; gap: 0.4rem; flex-wrap: wrap; }

  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .empty-state h3 { font-size: 1rem; color: var(--text); margin-bottom: 0.5rem; }

  /* Modal */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 500; align-items: center; justify-content: center; padding: 1rem; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 480px; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--gold-light); margin-bottom: 1.25rem; }
  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.84rem; }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .detail-value { color: var(--text); text-align: right; max-width: 60%; word-break: break-all; }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }

  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 10px; padding: 0.8rem 1.2rem; font-size: 0.84rem; z-index: 9999; transform: translateY(4rem); opacity: 0; transition: all 0.3s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/admin">✦ ModernSocial.app</a>
  <span class="nav-badge">Admin</span>
  <div class="nav-links">
    <a href="/admin">Dashboard</a>
    <a href="/admin/leads">Leads</a>
    <a href="/admin/users" class="active">Users</a>
  </div>
  <div class="nav-right">
    <button class="nav-logout" onclick="location.href='/admin/logout'">Log out</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">Users</div>
      <div class="page-sub">All business accounts on the platform</div>
    </div>
    <button class="btn btn-gold" onclick="openAddUser()">+ Add User</button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search by name, email, type…" oninput="renderTable()">
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Business</th>
          <th>Type</th>
          <th>Email</th>
          <th>Auth</th>
          <th>Joined</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">🏢</div>
      <h3>No users yet</h3>
    </div>
  </div>
</main>

<!-- Add User modal -->
<div class="modal-backdrop" id="addUserModal">
  <div class="modal">
    <div class="modal-title">Add User</div>
    <div class="field-group">
      <label>Business Name</label>
      <input type="text" id="newName" placeholder="e.g. The Golden Fork" autocomplete="off">
    </div>
    <div class="field-group">
      <label>Email</label>
      <input type="email" id="newEmail" placeholder="owner@example.com" autocomplete="off">
    </div>
    <div class="field-group">
      <label>Password</label>
      <input type="password" id="newPassword" placeholder="Min 8 characters">
    </div>
    <div class="field-error" id="addUserError"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddUser()">Cancel</button>
      <button class="btn btn-gold" id="addUserBtn" onclick="submitAddUser()">Create Account</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-title" id="detailName">Account Details</div>
    <div id="detailBody"></div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" id="detailDeleteBtn" onclick="deleteUser()">Delete Account</button>
      <button class="btn btn-ghost" onclick="closeDetail()">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let users = [], viewingId = null;

async function loadUsers() {
  try {
    const res = await fetch('/api/db/restaurants');
    if (res.status === 401) { location.href = '/admin/login'; return; }
    users = await res.json();
    renderTable();
  } catch { showToast('Failed to load users', true); }
}

function renderTable() {
  const q     = document.getElementById('searchInput').value.toLowerCase();
  const tbody = document.getElementById('usersBody');
  const empty = document.getElementById('emptyState');

  const filtered = users.filter(u => {
    if (!q) return true;
    return [u.name, u.loginEmail, u.cuisineType, u.businessType, u.location].some(v => v?.toLowerCase().includes(q));
  });

  if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map(u => {
    const authBadge = u.googleId
      ? `<span class="badge badge-google">Google</span>`
      : u.loginEmail ? `<span class="badge badge-email">Email</span>` : `<span class="badge" style="background:rgba(255,255,255,0.04);color:var(--text-muted);border:1px solid var(--border)">None</span>`;
    const bizType = u.businessType || 'restaurant';
    const typeBadge = `<span class="badge badge-type">${capitalize(bizType)}</span>`;
    const joined = u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

    return `<tr>
      <td class="name-cell">${esc(u.name)}${u.location ? `<span style="color:var(--text-muted);font-size:0.75rem;display:block">${esc(u.location)}</span>` : ''}</td>
      <td>${typeBadge}</td>
      <td class="muted">${u.loginEmail ? esc(u.loginEmail) : '—'}</td>
      <td>${authBadge}</td>
      <td class="muted">${joined}</td>
      <td><div class="actions-cell">
        <button class="btn btn-ghost btn-sm" onclick="openDetail(${u.id})">View</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDelete(${u.id})">Delete</button>
      </div></td>
    </tr>`;
  }).join('');
}

function openDetail(id) {
  const u = users.find(x => x.id === id);
  if (!u) return;
  viewingId = id;
  document.getElementById('detailName').textContent = u.name;
  document.getElementById('detailBody').innerHTML = [
    ['ID',           u.id],
    ['Business Type',capitalize(u.businessType || 'restaurant')],
    ['Email',        u.loginEmail || '—'],
    ['Google Auth',  u.googleId ? '✓ Connected' : 'No'],
    ['Location',     u.location || '—'],
    ['Cuisine/Type', u.cuisineType || '—'],
    ['Owner',        u.ownerName || '—'],
    ['Chef',         u.chefName || '—'],
    ['Instagram',    u.instagramUserId ? `Connected (${u.instagramUserId})` : 'Not connected'],
    ['Auto-publish', u.autoPublishEnabled ? 'On' : 'Off'],
    ['Joined',       u.createdAt ? new Date(u.createdAt).toLocaleString() : '—'],
  ].map(([label, value]) => `
    <div class="detail-row">
      <span class="detail-label">${label}</span>
      <span class="detail-value">${esc(String(value))}</span>
    </div>`).join('');
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); viewingId = null; }

function confirmDelete(id) {
  const u = users.find(x => x.id === id);
  if (!confirm(`Delete account for "${u?.name}"?\n\nThis will permanently delete all their posts, jobs, and data. This cannot be undone.`)) return;
  doDelete(id);
}

async function deleteUser() {
  if (!viewingId) return;
  const u = users.find(x => x.id === viewingId);
  if (!confirm(`Delete account for "${u?.name}"? This cannot be undone.`)) return;
  await doDelete(viewingId);
  closeDetail();
}

async function doDelete(id) {
  try {
    const res = await fetch(`/api/db/restaurants/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json()).error || 'Delete failed');
    await loadUsers();
    showToast('Account deleted');
  } catch (e) { showToast(e.message, true); }
}

function openAddUser() {
  document.getElementById('newName').value = '';
  document.getElementById('newEmail').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('addUserError').style.display = 'none';
  document.getElementById('addUserModal').classList.add('open');
  document.getElementById('newName').focus();
}

function closeAddUser() {
  document.getElementById('addUserModal').classList.remove('open');
}

async function submitAddUser() {
  const name     = document.getElementById('newName').value.trim();
  const email    = document.getElementById('newEmail').value.trim();
  const password = document.getElementById('newPassword').value;
  const errEl    = document.getElementById('addUserError');
  const btn      = document.getElementById('addUserBtn');

  errEl.style.display = 'none';
  if (!name || !email || !password) { errEl.textContent = 'All fields are required.'; errEl.style.display = 'block'; return; }
  if (password.length < 8)          { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const res  = await fetch('/api/auth/signup', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ restaurantName: name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to create account');
    closeAddUser();
    await loadUsers();
    showToast(`Account created for ${name}`);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = error ? 'rgba(204,68,68,0.4)' : 'var(--gold-border)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

document.getElementById('detailModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeDetail(); });
document.getElementById('addUserModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAddUser(); });

loadUsers();
</script>
</body>
</html>
