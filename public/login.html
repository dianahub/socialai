<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ModernSocial.app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #090910;
    --bg-card:    #12121c;
    --bg-surface: #1a1a28;
    --gold:       #c8a84b;
    --gold-light: #e5c97a;
    --gold-dim:   rgba(200, 168, 75, 0.18);
    --gold-border:rgba(200, 168, 75, 0.18);
    --text:       #f0ede8;
    --text-muted: #7a7773;
    --border:     rgba(255,255,255,0.06);
    --red:        #cc4444;
    --green:      #4a9960;
  }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-card);
    border: 1px solid var(--gold-border);
    border-radius: 16px;
    padding: 2.5rem;
  }

  .login-logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.1rem;
    color: var(--gold-light);
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .login-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.4rem;
  }

  .login-sub {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
  }

  .field-group {
    margin-bottom: 1.1rem;
  }

  .field-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  .field-group input {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-group input:focus {
    border-color: rgba(200,168,75,0.4);
  }

  .btn-login {
    width: 100%;
    background: var(--gold-dim);
    border: 1px solid var(--gold-border);
    border-radius: 8px;
    padding: 0.75rem;
    color: var(--gold-light);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background 0.2s;
  }

  .btn-login:hover:not(:disabled) { background: rgba(200,168,75,0.3); }
  .btn-login:disabled { opacity: 0.5; cursor: default; }

  .error-msg {
    display: none;
    margin-top: 1rem;
    padding: 0.65rem 0.9rem;
    background: rgba(204,68,68,0.12);
    border: 1px solid rgba(204,68,68,0.25);
    border-radius: 8px;
    color: #e87878;
    font-size: 0.85rem;
  }

  .error-msg.show { display: block; }

  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.65rem;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.7rem 1rem; margin-bottom: 1.25rem;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.88rem;
    font-weight: 500; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    text-decoration: none;
  }
  .btn-google:hover { border-color: rgba(200,168,75,0.3); background: #1e1e2e; }

  .divider-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1.25rem; color: var(--text-muted); font-size: 0.75rem;
  }
  .divider-row::before, .divider-row::after { content: ''; flex: 1; border-top: 1px solid var(--border); }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.75rem 0 1.25rem;
  }

  .footer-note {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
    text-align: center;
  }
  .footer-note a { color: var(--gold-light); text-decoration: none; }
  .footer-note a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">✦ ModernSocial.app</div>
  <h1 class="login-title">Sign in</h1>
  <p class="login-sub">Enter your restaurant credentials to continue.</p>

  <a class="btn-google" id="googleBtn" href="/auth/google">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Continue with Google
  </a>

  <div class="divider-row">or sign in with email</div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="owner@yourrestaurant.com" autocomplete="email" required>
    </div>
    <div class="field-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn-login" type="submit" id="loginBtn">Sign in</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>

  <hr class="divider">
  <p class="footer-note">Don't have an account? <a href="/signup.html">Sign up free</a></p>
</div>

<script>
// Show OAuth error if redirected back with error param
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('error') === 'oauth_failed') {
  document.addEventListener('DOMContentLoaded', () => {
    const errEl = document.getElementById('errorMsg');
    if (errEl) { errEl.textContent = 'Google sign-in failed — please try again or use email.'; errEl.classList.add('show'); }
  });
}

async function doLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('errorMsg');

  btn.disabled    = true;
  btn.textContent = 'Signing in…';
  errEl.classList.remove('show');

  try {
    const res  = await fetch('/api/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    localStorage.setItem('authToken', data.token);
    window.location.href = '/index.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
    btn.disabled    = false;
    btn.textContent = 'Sign in';
  }
}
</script>
</body>
</html>
