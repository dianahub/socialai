<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing in…</title>
<style>
  body { background: #090910; color: #f0ede8; font-family: 'Inter', sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  p { color: #7a7773; font-size: 0.9rem; }
</style>
</head>
<body>
<p>Signing you in…</p>
<script>
  const hash   = window.location.hash.slice(1);
  const params = new URLSearchParams(hash);
  const token  = params.get('token');

  if (!token) {
    window.location.replace('/login.html?error=oauth_failed');
  } else {
    localStorage.setItem('authToken', token);
    // Ask the server if this account is already configured (has a restaurant name saved)
    fetch('/api/config', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.ok ? r.json() : {})
      .then(cfg => {
        const alreadySetUp = cfg.restaurantName && cfg.restaurantName.trim().length > 0;
        window.location.replace(alreadySetUp ? '/app.html' : '/onboarding.html');
      })
      .catch(() => {
        // On error fall back to onboarding to be safe
        window.location.replace('/onboarding.html');
      });
  }
</script>
</body>
</html>
