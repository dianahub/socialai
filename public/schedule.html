<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Schedule — Restaurant Social AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #090910;
    --bg-card:    #12121c;
    --bg-surface: #1a1a28;
    --gold:       #c8a84b;
    --gold-light: #e5c97a;
    --gold-dim:   rgba(200, 168, 75, 0.12);
    --gold-border:rgba(200, 168, 75, 0.14);
    --text:       #f0ede8;
    --text-muted: #7a7773;
    --green:      #4a9960;
    --green-dim:  rgba(74,153,96,0.12);
    --red:        #cc4444;
    --border:     rgba(255,255,255,0.05);
  }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem; height: 64px;
    background: rgba(9,9,16,0.95); border-bottom: 1px solid var(--gold-border);
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
  }
  .nav-brand { font-family: 'Playfair Display', Georgia, serif; font-size: 1.1rem; color: var(--gold-light); letter-spacing: 0.05em; }
  .nav-links { display: flex; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none; font-size: 0.8rem;
    font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.4rem 1rem; border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--gold-light); border-bottom-color: var(--gold); }

  main { max-width: 1240px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

  /* ── Schedule header ── */
  .schedule-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
  }
  .schedule-header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem; color: var(--text);
  }
  .schedule-header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem; }
  .header-actions { display: flex; gap: 0.75rem; flex-shrink: 0; }

  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.65rem 1.4rem; border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
    letter-spacing: 0.05em; cursor: pointer; border: none; text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-primary { background: var(--gold); color: #090910; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost {
    background: transparent; color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

  /* ── Legend ── */
  .legend {
    display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-pub  { background: var(--green); }
  .dot-ready{ background: var(--gold); }
  .dot-gen  { background: var(--gold); animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ── Week grid ── */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.75rem;
    align-items: start;
  }

  .day-col {
    background: var(--bg-card);
    border: 1px solid var(--gold-border);
    border-radius: 10px;
    overflow: hidden;
    min-height: 200px;
  }
  .day-col.today { border-color: rgba(200,168,75,0.4); }
  .day-col.today .day-head { background: var(--gold-dim); }

  .day-head {
    padding: 0.65rem 0.75rem;
    border-bottom: 1px solid var(--gold-border);
    text-align: center;
  }
  .day-name {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .day-col.today .day-name { color: var(--gold); }
  .day-date {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.2rem; color: var(--text); margin-top: 0.1rem;
  }
  .day-col.today .day-date { color: var(--gold-light); }

  .day-posts { padding: 0.5rem; display: flex; flex-direction: column; gap: 0.4rem; }

  /* ── Post card ── */
  .post-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.55rem 0.65rem;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .post-card:hover { border-color: rgba(200,168,75,0.3); background: rgba(26,26,40,0.8); }
  .post-card.expanded { border-color: rgba(200,168,75,0.35); }

  .post-top { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
  .platform-dot {
    width: 16px; height: 16px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .pd-instagram { background: linear-gradient(135deg,#f09433,#dc2743,#bc1888); }
  .pd-facebook  { background: #1877f2; }
  .pd-tiktok    { background: #111; border: 1px solid rgba(255,255,255,0.15); }
  .pd-x         { background: #111; border: 1px solid rgba(255,255,255,0.15); }
  .pd-linkedin  { background: #0a66c2; }

  .post-type {
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    padding: 0.1rem 0.35rem; border-radius: 3px;
  }
  .pt-image { background: rgba(74,153,96,0.15);  color: #6dbb88; }
  .pt-video { background: rgba(99,102,241,0.15); color: #818cf8; }
  .pt-story { background: rgba(236,72,153,0.12); color: #f472b6; }
  .pt-twin  { background: rgba(251,191,36,0.1);  color: #fbbf24; }

  .post-time { font-size: 0.68rem; color: var(--text-muted); margin-left: auto; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 0.15rem 0.45rem; border-radius: 99px;
  }
  .sp-published { background: var(--green-dim); color: var(--green); }
  .sp-ready     { background: var(--gold-dim);  color: var(--gold); }
  .sp-generating{
    background: var(--gold-dim); color: var(--gold);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .sp-generating::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }

  .post-caption-preview {
    font-size: 0.72rem; color: var(--text-muted); line-height: 1.4;
    margin-top: 0.3rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* Expanded detail */
  .post-detail {
    display: none; margin-top: 0.6rem; padding-top: 0.6rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem; color: var(--text-muted); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .post-card.expanded .post-detail { display: block; }
  .post-detail-label {
    font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.3rem;
  }

  .no-posts {
    text-align: center; padding: 1rem 0.5rem;
    color: rgba(255,255,255,0.08); font-size: 0.75rem;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 2rem; flex-wrap: wrap;
    background: var(--bg-card); border: 1px solid var(--gold-border);
    border-radius: 10px; padding: 1.25rem 1.75rem; margin-bottom: 1.5rem;
  }
  .stat { flex: 1; min-width: 80px; }
  .stat-num {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.8rem; color: var(--gold-light); line-height: 1;
  }
  .stat-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }

  /* ── Scrollable calendar on mobile ── */
  .calendar-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  #toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--bg-surface); border: 1px solid var(--gold-border);
    border-radius: 8px; padding: 0.8rem 1.2rem; color: var(--text);
    font-size: 0.85rem; opacity: 0; transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s; z-index: 200;
    pointer-events: none; max-width: 320px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--green); color: #6dbb88; }

  @media (max-width: 900px) {
    .week-grid { grid-template-columns: repeat(4, minmax(160px, 1fr)); }
    nav { padding: 0 1rem; }
  }
  @media (max-width: 600px) {
    .week-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>

<nav>
  <span class="nav-brand">✦ Restaurant Social AI</span>
  <div class="nav-links">
    <a href="index.html">Assets</a>
    <a href="generate.html">Generate</a>
    <a href="schedule.html" class="active">Schedule</a>
    <a href="approve.html">Approve</a>
  </div>
</nav>

<main>
  <div class="schedule-header">
    <div>
      <h1 id="scheduleTitle">Content Calendar</h1>
      <p id="scheduleSubtitle">Loading week schedule…</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="exportSchedule()">⬇ Export JSON</button>
      <a href="generate.html" class="btn btn-primary">+ Generate Content</a>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <div class="stat-num" id="statTotal">—</div>
      <div class="stat-label">Total Posts</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statPublished">—</div>
      <div class="stat-label">Published</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statReady">—</div>
      <div class="stat-label">Ready</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statGenerating">—</div>
      <div class="stat-label">Generating</div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-pub"></div>Published</div>
    <div class="legend-item"><div class="legend-dot dot-ready"></div>Ready to post</div>
    <div class="legend-item"><div class="legend-dot dot-gen"></div>Generating</div>
  </div>

  <!-- Calendar -->
  <div class="calendar-scroll">
    <div class="week-grid" id="weekGrid">
      <!-- Injected by JS -->
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
let scheduleData = [];

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Platform icon ──────────────────────────────────────────────────────────
const PLATFORM_ICONS = { instagram:'IG', facebook:'f', tiktok:'TT', x:'𝕏', linkedin:'in' };

function platformDot(platform) {
  const label = PLATFORM_ICONS[platform] || platform.slice(0,2).toUpperCase();
  return `<div class="platform-dot pd-${platform}">${label}</div>`;
}

function postTypeBadge(type) {
  const map = { image:'image', video:'video', story:'story', twin:'twin' };
  return `<span class="post-type pt-${map[type]||'image'}">${type.toUpperCase()}</span>`;
}

function statusPill(status) {
  if (status === 'published')
    return `<span class="status-pill sp-published">✓ Published</span>`;
  if (status === 'ready')
    return `<span class="status-pill sp-ready">● Ready</span>`;
  return `<span class="status-pill sp-generating">Generating</span>`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderSchedule(days) {
  const grid   = document.getElementById('weekGrid');
  const todayLabel = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  grid.innerHTML = days.map(day => {
    const isToday = day.dateLabel === todayLabel;

    const postsHtml = day.posts.length
      ? day.posts.map(post => `
          <div class="post-card" data-postid="${post.id}" onclick="togglePost(this)">
            <div class="post-top">
              ${platformDot(post.platform)}
              ${postTypeBadge(post.type)}
              <span class="post-time">${post.timeLabel}</span>
            </div>
            ${statusPill(post.status)}
            <div class="post-caption-preview">${post.captionPreview}</div>
            <div class="post-detail">
              <div class="post-detail-label">Full caption</div>
              ${escapeHtml(post.caption)}
            </div>
          </div>
        `).join('')
      : '<div class="no-posts">No posts</div>';

    return `
      <div class="day-col${isToday ? ' today' : ''}">
        <div class="day-head">
          <div class="day-name">${day.dayLabel.slice(0,3)}</div>
          <div class="day-date">${day.dateLabel}</div>
        </div>
        <div class="day-posts">${postsHtml}</div>
      </div>
    `;
  }).join('');

  // Stats
  const allPosts = days.flatMap(d => d.posts);
  document.getElementById('statTotal').textContent     = allPosts.length;
  document.getElementById('statPublished').textContent = allPosts.filter(p => p.status === 'published').length;
  document.getElementById('statReady').textContent     = allPosts.filter(p => p.status === 'ready').length;
  document.getElementById('statGenerating').textContent= allPosts.filter(p => p.status === 'generating').length;
}

function togglePost(card) {
  const wasExpanded = card.classList.contains('expanded');
  // Collapse all
  document.querySelectorAll('.post-card.expanded').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) card.classList.add('expanded');
}

function escapeHtml(str) {
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Export ─────────────────────────────────────────────────────────────────
function exportSchedule() {
  if (!scheduleData.length) { toast('No schedule loaded yet'); return; }
  const blob = new Blob([JSON.stringify(scheduleData, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'content-calendar.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Calendar exported', 'success');
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [schedule, config] = await Promise.all([
      fetch('/api/schedule').then(r => r.json()),
      fetch('/api/config').then(r => r.json()),
    ]);

    scheduleData = schedule;

    const name = config.restaurantName || 'Restaurant';
    document.getElementById('scheduleTitle').textContent = `${name} — Content Calendar`;

    const weekStart = schedule[0]?.dateLabel || '';
    const weekEnd   = schedule[6]?.dateLabel || '';
    document.getElementById('scheduleSubtitle').textContent =
      `Week of ${weekStart} – ${weekEnd}`;

    renderSchedule(schedule);
  } catch (e) {
    document.getElementById('scheduleSubtitle').textContent = 'Failed to load schedule.';
    console.error('Schedule load failed:', e);
  }
}

init();
</script>
</body>
</html>
